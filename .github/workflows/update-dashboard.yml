name: 🤖 Auto-Update AI Adoption Dashboard

on:
  schedule:
    # 09:00 Bangkok time (UTC+7) = 02:00 UTC, weekdays Mon–Fri
    - cron: '0 2 * * 1-5'
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  update:
    name: Check Drive & Update Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run dashboard updater
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GDRIVE_TOKEN_JSON: ${{ secrets.GDRIVE_TOKEN_JSON }}
        run: python scripts/update_dashboard.py

      - name: Commit & push if dashboard changed
        run: |
          git config user.name  "AI Dashboard Bot 🤖"
          git config user.email "bot@pcc-group.local"
          git add ai_adoption_dashboard.html scripts/.state.json
          if git diff --staged --quiet; then
            echo "ℹ️  Nothing to commit — dashboard already up to date."
          else
            TIMESTAMP=$(date '+%Y-%m-%d %H:%M UTC')
            git commit -m "🤖 Auto-update dashboard — $TIMESTAMP"
            git push
            echo "✅ Dashboard pushed to GitHub Pages"
          fi
